name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buf breaking reads the base branch from git history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm proto:lint
      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        run: pnpm buf breaking --against ".git#ref=origin/${{ github.base_ref }}"
      - name: Check generated code is up to date
        run: |
          pnpm proto:generate
          git add --all
          git diff --cached --exit-code --stat || {
            echo "::error::Generated code is stale. Run 'pnpm proto:generate' and commit the result."
            exit 1
          }
        env:
          # Optional; raises the Buf Schema Registry rate limit for remote plugins.
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@v2
      # The prebuilt Skia of crates/render links them on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev
      - run: crates/render/fetch-fonts.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: runtimes/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  # The render core's C API as Swift uses it: build the static library, then
  # the Swift package that links it, and draw the demo frames.
  render:
    runs-on: ubuntu-24.04
    container: swift:6.4.1-noble
    env:
      # The image has clang but no cc.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install -y --no-install-recommends curl libfontconfig1-dev libfreetype-dev
      - run: curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
      - run: crates/render/fetch-fonts.sh
      - run: ~/.cargo/bin/cargo build -p irisrun-render --release --locked
      - working-directory: crates/render/swift
        run: |
          swift build -c release -Xlinker -L"$GITHUB_WORKSPACE/target/release"
          mkdir -p frames && .build/release/render-demo frames
      - uses: actions/upload-artifact@v7
        with:
          name: render-frames
          path: crates/render/swift/frames

  swift:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: swift:6.4.1-noble
          - os: macos-15
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        working-directory: runtimes/ios
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: swift test

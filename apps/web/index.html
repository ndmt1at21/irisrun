<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iris</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9.5' fill='none' stroke='%235b5bd6' stroke-width='2.5'/><circle cx='12' cy='12' r='4.5' fill='%235b5bd6'/><circle cx='13.6' cy='10.4' r='1.3' fill='white'/></svg>"
    />
    <script>
      // Picks the theme before the first paint: the saved choice, else the OS's.
      try {
        const theme = localStorage.getItem("iris-theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
irisrun-doctor = { path = "crates/doctor" }
irisrun-engine = { path = "crates/engine" }
irisrun-protocol = { path = "crates/protocol" }
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws"] }
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
futures-util = { version = "0.3", features = ["sink"] }
goblin = "0.10"
indicatif = "0.18"
prost = "0.14"
prost-types = "0.14"
reqwest = "0.13"
roxmltree = "0.21"
# The prebuilt Skia binaries cover the default features plus textlayout.
skia-safe = { version = "0.153", features = ["textlayout"] }
serde_json = "1"
# Pure-Rust crypto: no C toolchain or CMake needed to build the gateway.
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
rust-embed = { version = "8.13", features = ["mime-guess"] }
sha1 = "0.11"
sha2 = "0.11"
tar = "0.4"
tempfile = "3.27"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
webpki-root-certs = "1.0"
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"

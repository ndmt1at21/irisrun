<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>Iris cloud device</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #111; color: #bbb; font: 13px system-ui, sans-serif; }
  video { height: 92vh; border-radius: 24px; background: #000; touch-action: none; }
  #status { position: fixed; top: 8px; left: 12px; }
</style>
<p id="status">Connecting…</p>
<video id="screen" autoplay muted playsinline></video>
<script type="module">
  // A test player for irisrun-gateway; the Device UI gets the real one
  // (P0-12). Input goes out as Device Protocol HostMessage envelopes,
  // encoded by hand to keep this page free of a build step.
  const screen = document.getElementById("screen");
  const status = document.getElementById("status");

  // Protobuf wire format: a key is (field << 3 | wire type).
  const varint = (n) => { const out = []; while (n > 127) { out.push((n & 127) | 128); n >>>= 7; } out.push(n); return out; };
  const field = (number, bytes) => [...varint((number << 3) | 2), ...varint(bytes.length), ...bytes];
  const uint = (number, value) => [...varint(number << 3), ...varint(value)];
  const float = (number, value) => [...varint((number << 3) | 5), ...new Uint8Array(new Float32Array([value]).buffer)];
  const text = (number, value) => field(number, [...new TextEncoder().encode(value)]);
  // HostMessage.input = 1; Input: touch = 1, key = 2, text = 3, button = 4.
  const input = (event) => new Uint8Array(field(1, event));

  const pc = (window.pc = new RTCPeerConnection()); // window.pc for getStats() from the console
  pc.addTransceiver("video", { direction: "recvonly" });
  const channel = pc.createDataChannel("device");
  channel.binaryType = "arraybuffer";
  const send = (message) => channel.readyState === "open" && channel.send(message);
  pc.ontrack = (event) => (screen.srcObject = new MediaStream([event.track]));
  pc.onconnectionstatechange = () => (status.textContent = pc.connectionState);

  await pc.setLocalDescription(await pc.createOffer());
  const answer = await fetch("/offer", { method: "POST", body: JSON.stringify(pc.localDescription) });
  if (!answer.ok) throw new Error(await answer.text());
  await pc.setRemoteDescription(await answer.json());

  // TouchPhase: began 1, moved 2, ended 4, cancelled 5. One finger: the mouse.
  const touch = (event, phase) => {
    if (!screen.videoWidth) return;
    const box = screen.getBoundingClientRect();
    const x = ((event.clientX - box.left) * screen.videoWidth) / box.width;
    const y = ((event.clientY - box.top) * screen.videoHeight) / box.height;
    const point = [...uint(1, 0), ...uint(2, phase), ...float(3, x), ...float(4, y)];
    send(input(field(1, field(1, point))));
  };
  let down = false;
  screen.onpointerdown = (event) => { down = true; screen.setPointerCapture(event.pointerId); touch(event, 1); };
  screen.onpointermove = (event) => down && touch(event, 2);
  screen.onpointerup = (event) => { down = false; touch(event, 4); };
  screen.onpointercancel = (event) => { down = false; touch(event, 5); };

  // Typed text arrives as commit_text; editing keys as KeyInput (action down 1, up 2).
  const keys = new Set(["Enter", "Backspace", "Delete", "Tab", "Escape", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"]);
  const key = (event, action) => send(input(field(2, [...uint(1, action), ...text(2, event.code)])));
  document.onkeydown = (event) => {
    if (keys.has(event.code)) key(event, 1);
    else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey) send(input(field(3, text(1, event.key))));
    else return;
    event.preventDefault();
  };
  document.onkeyup = (event) => keys.has(event.code) && key(event, 2);
  // Button: back 1, home 2, app switch 3. Both are also handy from the console.
  window.pressButton = (button) => send(input(field(4, uint(1, button))));
  window.typeText = (value) => send(input(field(3, text(1, value))));
</script>
</html>
